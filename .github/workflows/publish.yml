name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Add test swap
        run: |
          sudo fallocate -l 4G "$RUNNER_TEMP/test.swap"
          sudo chmod 600 "$RUNNER_TEMP/test.swap"
          sudo mkswap "$RUNNER_TEMP/test.swap"
          sudo swapon "$RUNNER_TEMP/test.swap"

      - run: npm run build && node --test --test-concurrency=1 dist/test/*.test.js

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - name: Publish if version is absent
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          package="$name@$version"

          npm view "$name" name >/dev/null
          if output=$(npm view "$package" version --json 2>&1); then
            echo "$package is already published"
          elif grep -Eq '"code"[[:space:]]*:[[:space:]]*"E404"' <<<"$output"; then
            npm publish --tag alpha --provenance || npm view "$package" version >/dev/null
          else
            printf '%s\n' "$output" >&2
            exit 1
          fi
