name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Add test swap
        run: |
          sudo fallocate -l 4G "$RUNNER_TEMP/test.swap"
          sudo chmod 600 "$RUNNER_TEMP/test.swap"
          sudo mkswap "$RUNNER_TEMP/test.swap"
          sudo swapon "$RUNNER_TEMP/test.swap"

      - run: npm test
      - run: git diff --exit-code -- docs/capabilities.md
